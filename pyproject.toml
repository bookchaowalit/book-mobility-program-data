[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-mobility-program-data"
version = "0.1.0"
description = "Find supported travel and exchanges with destination and coverage terms."
requires-python = ">=3.10"
dependencies = ["jsonschema==4.19.2"]

[project.scripts]
book-mobility-program-data = "book_mobility_program_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
book_mobility_program_data = ["*.json"]
